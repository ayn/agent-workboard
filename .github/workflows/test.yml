name: Test
on:
  push:
    branches: [main]
    paths: ['workboard.py', 'tests/**', 'examples/**', 'pyproject.toml', '.github/workflows/test.yml']
  pull_request:
    paths: ['workboard.py', 'tests/**', 'examples/**', 'pyproject.toml', '.github/workflows/test.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: macos-14, python: '3.14'}
          - {os: windows-2025, python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: agent-workboard --version
