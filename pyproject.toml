[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workboard"
version = "0.1.0"
description = "A local live work dashboard for agents, scripts, and humans"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-workboard = "workboard:main"

[project.urls]
Repository = "https://github.com/ayn/agent-workboard"
Issues = "https://github.com/ayn/agent-workboard/issues"

[tool.setuptools]
py-modules = ["workboard"]
